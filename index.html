<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Future of Clubs · University Laboratory School and College</title>
  <meta
    name="description"
    content="The Future of Clubs — a custom, data-driven HTML/CSS/JS slide deck. Doc ref ULSC/UCA/2026-08. Presentation date: 20 August 2026."
  />

  <!-- ============================================================
       The Future of Clubs · ULSC/UCA/2026-08
       No frameworks. No npm. No build step.
       ============================================================ -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- Design system -->
  <link rel="stylesheet" href="css/foundation.css" />
  <link rel="stylesheet" href="css/deck.css" />

  <!-- Deck engine -->
  <script type="module" src="js/engine.js"></script>
</head>
<body>
  <!-- The ULSC mark (SVG symbol) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ulsc-mark" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="43" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="48" cy="48" r="36" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/>
      <path d="M48 10.5 l2.4 5.1 5.1 2.4 -5.1 2.4 -2.4 5.1 -2.4 -5.1 -5.1 -2.4 5.1 -2.4 z" fill="currentColor"/>
      <path d="M41 30 h14 M44 30 v13 L31.5 65 q-2.2 5 2.6 5 h27.8 q4.8 0 2.6 -5 L52 43 V30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M37 58 h22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="45" cy="50" r="2.2" fill="currentColor"/>
      <circle cx="52" cy="46" r="1.6" fill="currentColor"/>
    </symbol>
  </svg>

  <!-- Deck stage -->
  <div id="stage" data-theme="core">
    <div id="deck" role="main" aria-live="polite">
      <noscript>
        <p>
          This presentation requires JavaScript. Please enable JavaScript and
          reload the page.
        </p>
      </noscript>
    </div>

    <!-- Hideable chrome -->
    <div class="chrome">
      <div class="c-top">
        <div class="brand">
          <svg class="logo"><use href="#ulsc-mark"/></svg>
          ULSC · THE FUTURE OF CLUBS
        </div>
        <div class="c-right">A STUDENT PRESENTATION · 20 AUGUST 2026</div>
      </div>
      <div class="c-bot">
        <div class="count">
          <span><b id="cur">01</b><small> / <span id="tot">46</span></small></span>
          <span class="prog"><i id="prog"></i></span>
        </div>
        <button id="help" title="Shortcuts ( ? )">?</button>
      </div>
      <div class="panel" id="panel" role="dialog" aria-label="Keyboard shortcuts">
        <div class="panel-h">CONTROLS <button id="pclose" title="Close">×</button></div>
        <div class="krow"><kbd>→ / SPACE</kbd><span>Next slide</span></div>
        <div class="krow"><kbd>←</kbd><span>Previous slide</span></div>
        <div class="krow"><kbd>HOME / END</kbd><span>First / last slide</span></div>
        <div class="krow"><kbd>G</kbd><span>Overview — all slides, click to jump</span></div>
        <div class="krow"><kbd>F</kbd><span>Fullscreen</span></div>
        <div class="krow"><kbd>B</kbd><span>Blackout the screen</span></div>
        <div class="krow"><kbd>H</kbd><span>Focus mode — hide everything, slide only</span></div>
        <div class="krow"><kbd>?</kbd><span>This panel</span></div>
        <div class="krow"><kbd>ESC</kbd><span>Close panels</span></div>
      </div>
    </div>

    <div class="grain"></div>
    <div id="black"></div>
  </div>

  <!-- Dynamic slide counter -->
  <div id="slide-counter" class="slide-counter" aria-live="polite"></div>
</body>
</html>
